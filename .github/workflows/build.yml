name: Build APK

# Pull requests run the tests and a full build. Only code that lands on main
# publishes a release with the installable APK.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests and debug build
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Keep the test report if tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Keep the APK as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: adskip-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK as a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ad Skip build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
