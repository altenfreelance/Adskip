name: Build APK

# Pull requests run the tests and a full build. Only code that lands on main
# publishes a release with the installable APK.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the open TV remote code database (CC0)
        uses: actions/checkout@v4
        with:
          repository: UberGuidoZ/Flipper-IRDB
          path: irdb
          sparse-checkout: TVs
          filter: blob:none

      - name: Test the code table builder
        run: python3 -m unittest discover -s tools -v

      - name: Build the TV code table for the app
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/build_tv_codes.py irdb/TVs app/src/main/assets/tvcodes.json 2>&1 | tee tvtable.log

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests and debug build
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Keep the test report if tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Keep the APK as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: adskip-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK as a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Commercial Skip build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk

      - name: Save the build logs to the ci-logs branch
        if: always() && github.event_name == 'push'
        continue-on-error: true
        run: |
          mkdir -p /tmp/logs
          cp build.log tvtable.log /tmp/logs/ 2>/dev/null || true
          tail -n 300 /tmp/logs/build.log > /tmp/logs/build-tail.txt 2>/dev/null || true
          {
            echo "status: ${{ job.status }}"
            echo "commit: ${{ github.sha }}"
            echo "run: ${{ github.run_number }}"
          } > /tmp/logs/status.txt
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q --orphan ci-logs
          git rm -rf -q . || true
          cp /tmp/logs/* .
          git add -f status.txt build-tail.txt build.log tvtable.log 2>/dev/null || git add -f status.txt
          git commit -q -m "CI logs for run ${{ github.run_number }}"
          git push -f origin ci-logs
